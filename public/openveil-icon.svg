  <g stroke="#C4C0FF" stroke-width="2.9" stroke-linecap="round">
    <circle cx="24" cy="24" r="15" />
    <path d="M24 9 L24 24 L36.7 31.5" />
  </g>
  <rect x="22.27" y="22.27" width="3.46" height="3.46" fill="#C4C0FF" />
</svg>
